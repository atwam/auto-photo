[workspace]
resolver = "2"
members = ["crates/photo-core", "crates/photo-cli"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tract-onnx = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"

[profile.dev.package."*"]
opt-level = 3
